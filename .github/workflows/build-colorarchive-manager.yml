name: Build ColorArchive Manager (BakaSU)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build signed manager APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout assets (keystore + hash script)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github

      - name: Read pinned KSU commit from kernel repo
        run: |
          set -x
          PIN_URL="https://raw.githubusercontent.com/one899/android_kernel_oneplus_sm8350_9rt_295bpf/p0/lkm/.github/ksu_pin.txt"
          SHA=$(curl -fsSL "$PIN_URL" | tr -d '\r\n' | sed 's/^KSU_SHA=//')
          if [ -z "$SHA" ]; then echo "pin missing, fallback to main"; SHA=main; fi
          echo "KSU_SHA=$SHA" >> $GITHUB_ENV
          echo "using KSU ref: $SHA"

      - name: Checkout BakaSU at pinned commit
        uses: actions/checkout@v6
        with:
          repository: Baka-SU/BakaSU
          ref: ${{ env.KSU_SHA }}
          path: src
          fetch-depth: 0

      - name: Show source info (official, no patches)
        run: |
          set -x
          echo "commit: $(git -C src rev-parse HEAD)"
          echo "commit count: $(git -C src rev-list --count HEAD)"
          echo "expected versionCode: $(( $(git -C src rev-list --count HEAD) + 30700 ))"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SDKMAN=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" --install "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" 2>&1 | tail -5

      - name: Restore keystore
        run: |
          base64 -d .github/manager/ksu-release.jks.b64 > /tmp/ksu.jks
          keytool -list -keystore /tmp/ksu.jks -storepass one899ksu 2>&1 | head -4

      - name: Build APK
        env:
          KEYSTORE_FILE: /tmp/ksu.jks
          KEYSTORE_PASSWORD: one899ksu
          KEY_ALIAS: ksu
          KEY_PASSWORD: one899ksu
        run: |
          cd src/manager
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PKEYSTORE_FILE="$KEYSTORE_FILE" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD" 2>&1 | tail -40
          ls -l app/build/outputs/apk/release/ 2>/dev/null || true

      - name: Inject libksud.so and sign
        env:
          KS_PASS: one899ksu
          KS_ALIAS: ksu
        run: |
          set -x
          BT=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1)
          APK=$(find src/manager -name '*-arm64-v8a-release.apk' | head -1)
          echo "base apk: $APK"
          curl -sSL -o official.apk "https://github.com/Baka-SU/BakaSU/releases/download/v4.2.0-rc3/ReSukiSU_v4.2.0-rc3_35171-arm64-v8a-release.apk"
          mkdir -p libs && unzip -o -q official.apk 'lib/*' -d libs
          cp -f "$APK" injected.apk
          mkdir -p lib/arm64-v8a
          cp -f libs/lib/arm64-v8a/libksud.so lib/arm64-v8a/libksud.so
          zip -u -0 injected.apk lib/arm64-v8a/libksud.so
          "${BT}zipalign" -f -p 4 injected.apk aligned.apk
          "${BT}apksigner" sign --ks /tmp/ksu.jks --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --out BakaSU-ColorArchive-signed.apk aligned.apk
          "${BT}apksigner" verify --print-certs BakaSU-ColorArchive-signed.apk | head -6
          ls -l BakaSU-ColorArchive-signed.apk

      - name: Signature size/hash + install metadata
        run: |
          python3 .github/manager/apk_sig_hash.py BakaSU-ColorArchive-signed.apk || true
          echo "=== 内核应使用的变量 ==="
          echo "KSU_EXPECTED_SIZE=$(python3 .github/manager/apk_sig_hash.py BakaSU-ColorArchive-signed.apk | grep SIZE= | cut -d= -f2)"
          echo "KSU_EXPECTED_HASH=$(python3 .github/manager/apk_sig_hash.py BakaSU-ColorArchive-signed.apk | grep '^HASH=' | cut -d= -f2)"

      - uses: actions/upload-artifact@v6
        with:
          name: bakasu-manager-signed
          path: BakaSU-ColorArchive-signed.apk